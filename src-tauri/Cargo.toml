[package]
name = "peropix"
version = "3.0.0"
description = "PeroPix — NAI 전용 이미지 생성 툴"
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[lib]
name = "peropix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ★고아 사이드카 방지 — 파이썬 자식을 Job Object 에 매단다 (backend.rs `adopt_into_job`).
#   tauri 가 이미 끌어오는 크레이트라 새로 받는 것이 없다.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading",
  # ★가장자리 판정을 웹뷰로 넘긴다 (window_edge.rs) — 커서와 누름의 주인을 하나로
  "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
  # ★보이지 않는 테두리 두께를 잰다 (window_edge.rs 의 `frame_inset`)
  "Win32_Graphics_Dwm", "Win32_UI_HiDpi",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true
