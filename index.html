<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PeroPix</title>

    <!--
      ★★첫 화면을 **여기서** 그린다 (사용자 지적 2026-08-27: *"처음에 스플래시 화면이 안 뜨고
        흰 화면이 한참 뜨다가 스플래시 화면이 잠깐 뜨고 켜짐"*).

      까닭: 앱의 부팅 화면(`App.tsx` 의 `Booting`)은 **리액트 컴포넌트**라 번들을 받아
      마운트한 뒤에야 그려진다. 그동안 웹뷰는 아무 스타일도 없는 빈 문서를 띄우므로
      **흰 바탕**이 그대로 보인다. 그래서 같은 모습을 소스에 직접 적어 첫 페인트부터 세운다.

      ★리액트가 `#root` 에 처음 그릴 때 **이 안의 것을 스스로 치운다** — 지우는 코드가 따로
        필요 없다 (React 18 의 `createRoot` 가 컨테이너를 비운다).
      ★색은 `styles/tokens.css` 의 `--bg`·`--accent` 를 **그대로 옮겨 적었다.** 그 파일도
        아직 안 왔을 때라 변수를 못 쓴다 — 토큰을 고치면 여기도 함께 고친다.
      ★테마와 첫 문구를 고르는 일은 `public/boot.js` 가 한다 — **인라인으로 못 쓴다**
        (CSP 가 `script-src 'self'` 라 문서에 박은 스크립트는 막힌다. 스타일은
        `'unsafe-inline'` 이라 통과해서, 모양은 뜨는데 글자만 안 뜨는 모습이 된다).
    -->
    <style>
      :root { --boot-bg: #eef1f4; --boot-fg: #2f6fa8; --boot-line: #d5dae0; --boot-dim: #78838f; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) { --boot-bg: #16161a; --boot-fg: #7c6cf0; --boot-line: #2a2a31; --boot-dim: rgba(236,236,241,0.55); }
      }
      :root[data-theme="dark"] { --boot-bg: #16161a; --boot-fg: #7c6cf0; --boot-line: #2a2a31; --boot-dim: rgba(236,236,241,0.55); }
      html, body { margin: 0; height: 100%; background: var(--boot-bg); }
      #boot {
        position: fixed; inset: 0; display: grid; place-content: center;
        justify-items: center; gap: 20px;
      }
      #boot .mark {
        width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center;
        background: var(--boot-fg); color: #fff; font: 700 14px system-ui, sans-serif;
      }
      #boot .bar {
        width: 132px; height: 2px; border-radius: 1px; background: var(--boot-line); overflow: hidden;
      }
      #boot .bar i {
        display: block; width: 34%; height: 100%; background: var(--boot-fg);
        animation: boot 1.1s ease-in-out infinite;
      }
      /* ★글자도 함께 세운다 (사용자 지적 2026-08-27: *"스플래시가 바로 뜨긴 하는데 첫 문구가
         안 떠"*). 크기·색은 앱의 `Booting` 과 같은 값이다 (`--text-2xs` = 12px · `--ink-dim`). */
      #boot .say { font: 12px/1.6 system-ui, sans-serif; color: var(--boot-dim); }
      /* ★★**어느 줄을 보일지는 CSS 가 고른다** (2026-08-27). 자바스크립트로 글자를 적으려
         했더니 못 떴다: `boot.js` 는 `<head>` 에서 도는데 글자 칸이 아직 없어 `DOMContentLoaded`
         를 기다려야 하고, 그 사건은 **모듈 스크립트가 다 돈 뒤**에 온다 — 그때는 리액트가
         이미 `#root` 를 비운 뒤라 적을 자리가 없다 (개발 중 10초 동안 막대만 떴다).
         ★그래서 세 줄을 처음부터 적어 두고 **표식으로 고른다.** `boot.js` 가 못 돌아도
           한 줄은 뜬다 — 그 경우 한국어다 (이 앱의 기본 언어). */
      #boot .say > span { display: none; }
      html:not([data-boot-locale]) #boot .say > [data-l="ko"],
      html[data-boot-locale="ko"] #boot .say > [data-l="ko"],
      html[data-boot-locale="en"] #boot .say > [data-l="en"],
      html[data-boot-locale="ja"] #boot .say > [data-l="ja"] { display: inline; }
      /* ★앱의 `.boot-bar` 와 같은 움직임이다 (`styles/globals.css` 의 `peropix-boot`) —
         리액트가 붙는 순간 모양이 튀지 않아야 한다 */
      @keyframes boot { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
      @media (prefers-reduced-motion: reduce) {
        #boot .bar i { animation: none; width: 100%; opacity: 0.5; }
      }
    </style>
    <!-- ★인라인으로 못 쓴다 — CSP 가 `script-src 'self'` 다 (`public/boot.js` 머리 주석) -->
    <script src="/boot.js"></script>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="mark">P</div>
        <div class="bar"><i></i></div>
        <div class="say">
          <span data-l="ko">엔진을 깨우는 중…</span>
          <span data-l="en">Starting the engine…</span>
          <span data-l="ja">エンジンを起動中…</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
