# 밀 때마다 도는 **가벼운 확인** — 릴리즈 빌드(Rust 포함, 수 분)와 갈라 둔다.
#
# ★여기서 도는 것은 **판정 하나하나**가 아니라 `test.bat` 이 부르는 것과 같은 것들이다:
#   타입 검사 · 프런트 빌드 · 백엔드 파이썬 판정 · 소스 대조 판정(노드).
#   ★`test.bat` 은 윈도우 배치라 여기서 그대로 못 부른다 — **같은 목록을 두 번 적는 것**이
#     되므로, 새 판정을 더할 때는 양쪽을 함께 본다.
name: Check

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: npm ci

      - name: 타입 검사 + 프런트 빌드
        run: npm run build

      - name: 백엔드 의존성
        run: pip install -r backend/requirements.txt

      # ★파이썬 판정은 저장소에 없다 (`.gitignore` 의 `backend/test_*.py`) — 로컬 전용이다.
      #   여기서는 **적어도 임포트가 되는지**를 본다: 의존성이 빠지면 앱이 켜지지 않는다.
      - name: 백엔드가 임포트되는가
        run: python -c "import sys; sys.path.insert(0, 'backend'); import server; print('ok')"
